spring:
  application:
    name: eggoj-backend-gateway
  cloud:
    nacos:
      discovery:
        server-addr:
          127.0.0.1:8848
    gateway:
      routes:
        - id: eggoj-backend-user-service
          uri: lb://eggoj-backend-user-service
          predicates:
            - Path=/api/user/**
        - id: eggoj-backend-question-service
          uri: lb://eggoj-backend-question-service
          predicates:
            - Path=/api/question/**
        - id: eggoj-backend-judge-service
          uri: lb://eggoj-backend-judge-service
          predicates:
            - Path=/api/judge/**
  main:
    web-application-type: reactive

server:
  port: 8101

knife4j:
  gateway:
    # 开启gateway聚合组件
    enabled: true
    # 设置聚合模式采用discover模式
    strategy: discover
    discover:
      # 开启discover模式
      enabled: true
      # 聚合子服务全部为Swagger2规范的文档
      version : swagger2
      # 需要排除的微服务(eg:网关服务)
#      excluded-services:
#        - gateway-service